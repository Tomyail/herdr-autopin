name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Build on Linux and cross-compile: the binary is pure Go (no cgo), and
    # macOS runners queue for many minutes on a busy day.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags "-X main.version=${GITHUB_REF_NAME}" -o herdr-autopin ./cmd/herdr-autopin

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Package
        # Tarballs are what install.sh expects: herdr-autopin-<version>-darwin-<arch>.tar.gz
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          version=${GITHUB_REF_NAME}
          [ "${GITHUB_REF_TYPE}" = tag ] || version="main-$(git rev-parse --short HEAD)"
          for arch in arm64 amd64; do
            name="herdr-autopin-${version}-darwin-${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-X main.version=${version}" -o "dist/${name}/herdr-autopin" ./cmd/herdr-autopin
            cp README.md LICENSE "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          done
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: herdr-autopin-${{ env.VERSION }}
          path: dist/*.tar.gz*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
